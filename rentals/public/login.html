<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in | O Double G Rentals</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="masthead"><div class="wrap masthead-in"><a class="brand" href="/">O Double G <span>Backline Rentals</span></a></div></header>
<main>
  <form id="f" class="signin">
    <h1>Sign in</h1>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <p id="err" class="form-error" role="alert" hidden></p>
    <button class="btn btn-go" type="submit">Sign in</button>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
