<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Montana State Fair Events</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
<div class="hero"><img src="/msf-banner.jpg" srcset="/msf-banner-700.jpg 700w, /msf-banner.jpg 1400w" sizes="(max-width: 1100px) 100vw, 1100px" alt="Montana State Fair"></div>
<header class="top bar">
  <div class="brand">
    <div>
      <h1 id="fairName" style="font-size:1rem">Events</h1>
      <div class="sub" id="subline">Montana ExpoPark · Great Falls</div>
    </div>
    <div class="spacer"></div>
    <div class="tabs" role="tablist">
      <button class="tabbtn" role="tab" aria-selected="true" data-view="schedule">Schedule</button>
      <button class="tabbtn" role="tab" aria-selected="false" data-view="map">Map</button>
      <a class="tabbtn" href="/guide" style="text-decoration:none">Fair Guide</a>
    </div>
  </div>
  <div class="jump" id="jump">
    <button class="jumpbtn fairbtn" id="goFair" hidden>Fair <span id="fairRange"></span></button>
    <button class="jumpbtn" id="goToday">Today</button>
    <label class="pick"><span>Go to date</span><input type="date" id="pickDate" aria-label="Pick a date"></label>
  </div>
  <nav class="days" id="days" aria-label="Fair days"></nav>
</header>

<main>
  <section id="view-schedule">
    <div class="banner" id="apkBanner" hidden>
      <span style="flex:1">Get the fair app for Android, with indoor directions.</span>
      <a class="btn accent" href="/download">Download</a>
    </div>
    <div class="filters">
      <input class="search" id="search" type="search" placeholder="Search events, places…" aria-label="Search">
      <div class="chips" id="chips"></div>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-map" hidden>
    <div class="mapbar">
      <select id="mapPick" aria-label="Floor plan"></select>
      <select id="destPick" aria-label="Destination"><option value="">Choose a destination…</option></select>
      <button class="btn" id="clearRoute" hidden>Clear</button>
    </div>
    <div class="mapwrap" id="mapwrap" style="height:70vh">
      <div class="stage" id="stage">
        <img id="mapImg" alt="Fairgrounds map">
        <svg id="overlay"></svg>
      </div>
    </div>
    <p class="mapnote" id="mapNote">Pinch or scroll to zoom. Tap a pin to see what's happening there.</p>
    <div id="pinInfo"></div>
  </section>
</main>

<script src="/shared.js"></script>
<script src="/mapview.js?v=2"></script>
<script src="/app.js?v=2"></script>
</body>
</html>
